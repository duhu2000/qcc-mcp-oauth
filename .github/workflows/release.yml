name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Install host dependencies
        run: >-
          npm install --no-save --package-lock=false --legacy-peer-deps --ignore-scripts
          @deepseek-ai/dsh-storage-domain@0.2.0-rc.2
          @deepseek-ai/dsh-storage@0.2.0-rc.2
          @deepseek-ai/cordis@4.0.4
          @deepseek-ai/schemastery@3.18.4 zod@4.4.3
      - name: Verify host dependencies load
        run: node --input-type=module -e "await import('./lib/index.js')"
      - run: npm run lint
      - run: npm test
      # 发布到 npm（需在仓库 Secrets 配置 NPM_TOKEN；未配置时自动跳过，仅发 GitHub Release）
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # 生成 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
